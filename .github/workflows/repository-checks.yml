name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Test the repository gate
        run: python -m unittest discover -s tests -v
      - name: Check documentation and per-commit handoff updates
        env:
          REPOSITORY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_repository.py --ci
